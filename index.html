mkdir -p ~/Desktop/notion-music-widget && cd ~/Desktop/notion-music-widget && cat << 'EOF' > index.html
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notion YouTube Music Widget</title>
    <style>
        :root {
            --bg-color: #121216;
            --card-bg: rgba(255, 255, 255, 0.05);
            --card-hover: rgba(255, 255, 255, 0.09);
            --accent-color: #ff2a85;
            --accent-gradient: linear-gradient(135deg, #ff2a85 0%, #7928ca 100%);
            --text-main: #f1f1f6;
            --text-sub: #9ba1a6;
            --border-color: rgba(255, 255, 255, 0.1);
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }
        .widget-container {
            width: 100%;
            max-width: 360px;
            background: rgba(18, 18, 22, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            position: relative;
            overflow: hidden;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .app-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-sub);
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        .settings-btn {
            background: none;
            border: none;
            color: var(--text-sub);
            cursor: pointer;
            font-size: 16px;
            transition: color 0.2s;
        }
        .settings-btn:hover {
            color: var(--text-main);
        }
        .main-player {
            display: flex;
            align-items: center;
            gap: 14px;
            background: var(--card-bg);
            padding: 12px;
            border-radius: 14px;
            border: 1px solid var(--border-color);
            margin-bottom: 14px;
            position: relative;
        }
        .vinyl-container {
            position: relative;
            width: 60px;
            height: 60px;
            flex-shrink: 0;
        }
        .thumbnail {
            width: 60px;
            height: 60px;
            border-radius: 10px;
            object-fit: cover;
            position: relative;
            z-index: 2;
        }
        .vinyl {
            position: absolute;
            top: 0;
            left: 0;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: radial-gradient(circle, #000 30%, #222 31%, #111 60%, #333 61%);
            border: 2px solid rgba(255,255,255,0.2);
            z-index: 1;
            transition: transform 0.3s linear;
        }
        .playing .vinyl {
            animation: spin 3s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .track-info {
            flex-grow: 1;
            min-width: 0;
        }
        .track-title {
            font-size: 14px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 4px;
        }
        .track-artist {
            font-size: 12px;
            color: var(--text-sub);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 8px;
        }
        .controls-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .control-btn {
            background: none;
            border: none;
            color: var(--text-main);
            cursor: pointer;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: rgba(255,255,255,0.08);
            transition: background 0.2s;
        }
        .control-btn:hover {
            background: var(--accent-gradient);
        }
        .progress-container {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }
        .progress-bar {
            -webkit-appearance: none;
            width: 100%;
            height: 4px;
            border-radius: 2px;
            background: rgba(255,255,255,0.15);
            outline: none;
            cursor: pointer;
        }
        .progress-bar::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #fff;
            cursor: pointer;
        }
        .time-row {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            color: var(--text-sub);
        }
        .queue-header {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-sub);
            text-transform: uppercase;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }
        .queue-list {
            max-height: 160px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding-right: 2px;
        }
        .queue-list::-webkit-scrollbar {
            width: 4px;
        }
        .queue-list::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.2);
            border-radius: 2px;
        }
        .queue-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 6px 8px;
            border-radius: 8px;
            background: var(--card-bg);
            cursor: pointer;
            border: 1px solid transparent;
            transition: all 0.2s;
        }
        .queue-item:hover {
            background: var(--card-hover);
        }
        .queue-item.active {
            background: rgba(255, 42, 133, 0.15);
            border-color: rgba(255, 42, 133, 0.3);
        }
        .queue-thumb {
            width: 36px;
            height: 36px;
            border-radius: 6px;
            object-fit: cover;
            flex-shrink: 0;
        }
        .queue-info {
            flex-grow: 1;
            min-width: 0;
        }
        .queue-title {
            font-size: 12px;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .queue-artist {
            font-size: 10px;
            color: var(--text-sub);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .settings-modal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(18, 18, 22, 0.95);
            backdrop-filter: blur(10px);
            z-index: 10;
            padding: 20px;
            display: none;
            flex-direction: column;
            gap: 12px;
        }
        .settings-modal.open {
            display: flex;
        }
        .settings-modal h3 {
            font-size: 15px;
            margin-bottom: 4px;
        }
        .settings-modal label {
            font-size: 11px;
            color: var(--text-sub);
        }
        .settings-modal textarea {
            width: 100%;
            height: 80px;
            background: rgba(255,255,255,0.08);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: #fff;
            padding: 8px;
            font-size: 12px;
            resize: none;
        }
        .save-btn {
            background: var(--accent-gradient);
            border: none;
            color: #fff;
            padding: 8px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-size: 13px;
        }
        #youtube-player {
            display: none;
        }
    </style>
</head>
<body>
    <div class="widget-container" id="widget">
        <div class="header">
            <span class="app-title">YouTube Music</span>
            <button class="settings-btn" id="open-settings" title="Configurar playlist">⚙️</button>
        </div>

        <div class="main-player" id="main-player-card">
            <div class="vinyl-container" id="vinyl-box">
                <div class="vinyl"></div>
                <img id="current-thumb" class="thumbnail" src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=150" alt="Cover">
            </div>
            <div class="track-info">
                <div class="track-title" id="current-title">Cargando canción...</div>
                <div class="track-artist" id="current-artist">YouTube Music</div>
                <div class="controls-row">
                    <button class="control-btn" id="play-btn">▶</button>
                    <div class="progress-container">
                        <input type="range" class="progress-bar" id="progress" value="0" min="0" max="100">
                        <div class="time-row">
                            <span id="current-time">0:00</span>
                            <span id="total-time">0:00</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="queue-header">A continuación</div>
        <div class="queue-list" id="queue-list"></div>

        <div class="settings-modal" id="settings-modal">
            <h3>Configurar Playlist</h3>
            <label>Ingresa IDs de YouTube (uno por línea o separados por coma):</label>
            <textarea id="playlist-input">jfKfPfyJRdk, dQw4w9WgXcQ, 5NV6Rdv1a3I</textarea>
            <button class="save-btn" id="save-settings">Guardar y Reproducir</button>
        </div>
    </div>

    <div id="youtube-player"></div>

    <script>
        let playlist = [
            { id: 'jfKfPfyJRdk', title: 'Lofi hip hop radio - beats to study/relax to', artist: 'Lofi Girl' },
            { id: '5NV6Rdv1a3I', title: 'Coffee Shop Acoustic', artist: 'Relaxing Vibes' },
            { id: 'dQw4w9WgXcQ', title: 'Never Gonna Give You Up', artist: 'Rick Astley' }
        ];

        let currentIndex = 0;
        let player;
        let isPlaying = false;
        let progressInterval;

        const tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        const firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        window.onYouTubeIframeAPIReady = function() {
            player = new YT.Player('youtube-player', {
                height: '0',
                width: '0',
                playerVars: { 'autoplay': 0, 'controls': 0 },
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange
                }
            });
        };

        function onPlayerReady(event) {
            loadTrack(currentIndex);
        }

        function loadTrack(index) {
            currentIndex = index;
            const track = playlist[currentIndex];
            
            document.getElementById('current-title').innerText = track.title;
            document.getElementById('current-artist').innerText = track.artist;
            document.getElementById('current-thumb').src = `https://img.youtube.com/vi/${track.id}/hqdefault.jpg`;
            
            if (player && player.loadVideoById) {
                player.loadVideoById(track.id);
                if (isPlaying) player.playVideo();
            }
            renderQueue();
        }

        function onPlayerStateChange(event) {
            if (event.data == YT.PlayerState.PLAYING) {
                isPlaying = true;
                document.getElementById('play-btn').innerText = '❚❚';
                document.getElementById('main-player-card').classList.add('playing');
                startProgressTimer();
            } else {
                isPlaying = false;
                document.getElementById('play-btn').innerText = '▶';
                document.getElementById('main-player-card').classList.remove('playing');
                stopProgressTimer();
            }
            if (event.data == YT.PlayerState.ENDED) {
                nextTrack();
            }
        }

        function togglePlay() {
            if (!player) return;
            const state = player.getPlayerState();
            if (state == YT.PlayerState.PLAYING) {
                player.pauseVideo();
            } else {
                player.playVideo();
            }
        }

        function nextTrack() {
            currentIndex = (currentIndex + 1) % playlist.length;
            loadTrack(currentIndex);
        }

        function renderQueue() {
            const listEl = document.getElementById('queue-list');
            listEl.innerHTML = '';
            playlist.forEach((track, idx) => {
                item = document.createElement('div');
                item.className = `queue-item ${idx === currentIndex ? 'active' : ''}`;
                item.innerHTML = `
                    <img class="queue-thumb" src="https://img.youtube.com/vi/${track.id}/hqdefault.jpg">
                    <div class="queue-info">
                        <div class="queue-title">${track.title}</div>
                        <div class="queue-artist">${track.artist}</div>
                    </div>
                `;
                item.onclick = () => loadTrack(idx);
                listEl.appendChild(item);
            });
        }

        document.getElementById('play-btn').onclick = togglePlay;

        const progressBar = document.getElementById('progress');
        progressBar.oninput = function() {
            if (!player || !player.getDuration) return;
            const duration = player.getDuration();
            player.seekTo((progressBar.value / 100) * duration, true);
        };

        function startProgressTimer() {
            stopProgressTimer();
            progressInterval = setInterval(() => {
                if (!player || !player.getCurrentTime) return;
                const current = player.getCurrentTime();
                const duration = player.getDuration() || 1;
                progressBar.value = (current / duration) * 100;
                
                document.getElementById('current-time').innerText = formatTime(current);
                document.getElementById('total-time').innerText = formatTime(duration);
            }, 500);
        }

        function stopProgressTimer() {
            clearInterval(progressInterval);
        }

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        const modal = document.getElementById('settings-modal');
        document.getElementById('open-settings').onclick = () => modal.classList.add('open');
        document.getElementById('save-settings').onclick = () => {
            const input = document.getElementById('playlist-input').value;
            const ids = input.split(/[\n,]+/).map(s => s.trim()).filter(s => s.length > 0);
            if (ids.length > 0) {
                playlist = ids.map(id => ({ id: id, title: `Canción ID: ${id}`, artist: 'YouTube Music' }));
                loadTrack(0);
            }
            modal.classList.remove('open');
        };
    </script>
</body>
</html>
EOF
